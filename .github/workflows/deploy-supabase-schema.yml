name: Deploy Supabase schema

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-schema
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: haifsnaupqhlvgfoyvlc
      MIGRATION_BASELINE_THROUGH: 20260731_security_and_consistency_hardening.sql
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Apply pending migrations once
        run: node scripts/apply-supabase-migrations.mjs
