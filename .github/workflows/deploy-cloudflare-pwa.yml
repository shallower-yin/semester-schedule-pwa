name: Deploy Cloudflare PWA

# Manual by design until the Cloudflare deploy credentials are configured.
# The local release path uses the same wrangler.pwa.jsonc configuration.
on:
  workflow_dispatch:
    inputs:
      apk_version_code:
        description: "Publish this already verified APK version (empty preserves the current APK)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cloudflare-pwa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm run test
          node --test scripts/verify-static-android-channel.mjs
          node scripts/verify-stepenglish-download-worker.mjs

      - name: Build Cloudflare PWA
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          REQUIRE_RELEASE_NOTES: "true"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_APP_BASE: /
          VITE_APP_START_URL: /
          VITE_APP_URL: https://schedule.nfsg.eu.cc/
          VITE_APP_ASSET_MIRROR_URL: https://haifsnaupqhlvgfoyvlc.supabase.co/functions/v1/app-hosting/
          VITE_OUT_DIR: dist-cloudflare
        run: npm run build:cloudflare

      - name: Preserve the currently published static Android channel
        env:
          STATIC_PENDING_APK_CODE: ${{ inputs.apk_version_code }}
        run: node scripts/static-android-channel.mjs preserve

      - name: Stage the already published APK
        if: inputs.apk_version_code != ''
        env:
          EXPECTED_APK_CODE: ${{ inputs.apk_version_code }}
          APK_SOURCE_PATH: ${{ runner.temp }}/static-channel.apk
          APK_RELEASE_PATH: ${{ runner.temp }}/static-channel-release.json
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 60 'https://haifsnaupqhlvgfoyvlc.supabase.co/functions/v1/app-hosting/release.json' -o "$APK_RELEASE_PATH"
          apk_url=$(python3 - <<'PY'
          import json, os
          data=json.load(open(os.environ['APK_RELEASE_PATH'],encoding='utf-8'))
          assert str(data['apkVersionCode'])==os.environ['EXPECTED_APK_CODE'], 'Unexpected published APK version'
          assert data['apkUrl'].startswith('https://'), 'APK requires HTTPS'
          print(data['apkUrl'])
          PY
          )
          curl --fail --location --silent --show-error --retry 2 --max-time 120 "$apk_url" -o "$APK_SOURCE_PATH"
          node scripts/static-android-channel.mjs prepare

      - name: Deploy custom domain
        # First deploy retains the previous latest.json while publishing new APK bytes.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.130.0 deploy --config wrangler.pwa.jsonc

      - name: Verify public APK bytes and resume support before promoting latest
        if: inputs.apk_version_code != ''
        run: node scripts/static-android-channel.mjs promote

      - name: Publish the verified Android manifest
        if: inputs.apk_version_code != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.130.0 deploy --config wrangler.pwa.jsonc

      - name: Verify the static update response
        if: inputs.apk_version_code != ''
        env:
          EXPECTED_APK_CODE: ${{ inputs.apk_version_code }}
        run: |
          node --input-type=module - <<'JS'
          const response=await fetch('https://schedule.nfsg.eu.cc/android/latest.json?ts='+Date.now(),{cache:'no-store'});
          if(!response.ok || !response.headers.get('cache-control')?.includes('no-store') || response.headers.get('access-control-allow-origin')!=='*') throw new Error('Invalid static manifest headers');
          const value=await response.json();
          if(String(value.apkVersionCode)!==process.env.EXPECTED_APK_CODE) throw new Error('Static manifest version mismatch');
          console.log('Static Android manifest verified: '+value.apkVersionCode);
          JS
