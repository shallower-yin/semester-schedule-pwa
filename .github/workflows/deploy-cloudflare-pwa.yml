name: Deploy Cloudflare PWA

# Manual by design until the Cloudflare deploy credentials are configured.
# The local release path uses the same wrangler.pwa.jsonc configuration.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pwa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build Cloudflare PWA
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          REQUIRE_RELEASE_NOTES: "true"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_APP_BASE: /
          VITE_APP_START_URL: /
          VITE_APP_URL: https://schedule.nfsg.eu.cc/
          VITE_APP_ASSET_MIRROR_URL: https://haifsnaupqhlvgfoyvlc.supabase.co/functions/v1/app-hosting/
          VITE_OUT_DIR: dist-cloudflare
        run: npm run build:cloudflare

      - name: Deploy custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.130.0 deploy --config wrangler.pwa.jsonc
