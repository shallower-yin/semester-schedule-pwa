<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3157d5" />
    <meta name="description" content="本地优先、可离线使用的日程计划表" />
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <title>日程计划表</title>
    <script>
      window.__pwaInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__pwaInstallPrompt = event;
        window.dispatchEvent(new Event("pwa-install-available"));
      });
      window.addEventListener("appinstalled", function () {
        window.__pwaInstallPrompt = null;
      });
      // Recover from broken offline updates (white screen after mixed cache / wrong base path).
      (function () {
        var KEY = "semester-schedule-boot-recover-count";
        var attempts = Number(sessionStorage.getItem(KEY) || "0");
        function showBanner(text, actionable) {
          try {
            var existing = document.getElementById("boot-recover-banner");
            if (existing) {
              var message = existing.querySelector("[data-boot-message]");
              if (message) message.textContent = text;
              return;
            }
            var banner = document.createElement("div");
            banner.id = "boot-recover-banner";
            banner.setAttribute("role", actionable ? "alert" : "status");
            banner.style.cssText = "position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#f7f8fc;color:#172033;font:600 15px/1.5 system-ui,sans-serif;text-align:center;";
            var message = document.createElement("div");
            message.setAttribute("data-boot-message", "");
            message.textContent = text;
            banner.appendChild(message);
            if (actionable) {
              var hint = document.createElement("div");
              hint.textContent = "这通常由旧缓存或另一个仍在运行的旧版本标签页引起。已同步到云端和保存在本机数据库的数据不会被下面的操作删除。";
              hint.style.cssText = "max-width:560px;color:#697386;font:400 13px/1.65 system-ui,sans-serif;";
              var actions = document.createElement("div");
              actions.style.cssText = "display:flex;flex-wrap:wrap;justify-content:center;gap:10px;";
              var reload = document.createElement("button");
              reload.type = "button";
              reload.textContent = "重新加载";
              reload.style.cssText = "min-height:44px;border:1px solid #d6dbe7;border-radius:10px;padding:9px 18px;background:#fff;color:#172033;font:600 14px system-ui,sans-serif;cursor:pointer;";
              reload.onclick = function () { location.reload(); };
              var clear = document.createElement("button");
              clear.type = "button";
              clear.textContent = "清缓存重载";
              clear.style.cssText = "min-height:44px;border:0;border-radius:10px;padding:9px 18px;background:#3157d5;color:#fff;font:600 14px system-ui,sans-serif;cursor:pointer;";
              clear.onclick = function () { recover(true); };
              actions.appendChild(reload);
              actions.appendChild(clear);
              banner.appendChild(hint);
              banner.appendChild(actions);
            }
            document.body.appendChild(banner);
          } catch (_) {}
        }
        function recover(force) {
          if (!force && attempts >= 2) {
            showBanner("应用加载失败。请关闭后重新打开，或清除本站数据后再试。");
            return;
          }
          if (!force && attempts >= 1 && /[?&](recovered|reload)=/.test(location.search)) {
            // Already tried once this session; wait for second empty-root pass.
          }
          attempts += 1;
          sessionStorage.setItem(KEY, String(attempts));
          showBanner("检测到页面异常，正在清理缓存并重新加载…");
          var done = function () {
            var url = location.pathname + "?recovered=" + Date.now() + location.hash;
            location.replace(url);
          };
          var clearCaches = function () {
            if (!("caches" in window)) return Promise.resolve();
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            });
          };
          var clearWorkers = function () {
            if (!("serviceWorker" in navigator)) return Promise.resolve();
            return navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            });
          };
          Promise.resolve().then(clearWorkers).then(clearCaches).then(done, done);
        }
        window.addEventListener("error", function (event) {
          var target = event && event.target;
          if (target && (target.tagName === "SCRIPT" || target.tagName === "LINK")) recover(false);
        }, true);
        // An empty root can be normal on a slow phone. Never erase offline
        // assets merely because React has not rendered within a fixed timeout.
        window.setTimeout(function () {
          var root = document.getElementById("root");
          if (root && document.documentElement.dataset.appReady !== "true") {
            showBanner("应用没有按预期完成启动。请先关闭其他日程计划表标签页，再重新加载。", true);
          }
        }, 12000);
        // Successful boot: reset counter so future updates can recover again.
        window.addEventListener("load", function () {
          window.setTimeout(function () {
            var root = document.getElementById("root");
            if (root && document.documentElement.dataset.appReady === "true") {
              try { sessionStorage.removeItem(KEY); } catch (_) {}
              var banner = document.getElementById("boot-recover-banner");
              if (banner && banner.parentNode) banner.parentNode.removeChild(banner);
            }
          }, 800);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div role="status" aria-live="polite" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#f7f8fc;color:#697386;font:500 14px/1.6 system-ui,sans-serif;text-align:center;">
        正在打开日程计划表…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
